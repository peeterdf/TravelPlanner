name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          BUILD_TARGET: android
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Google Services
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          # Extract web client ID (type 3) and write the string resource directly
          # This is what the google-services Gradle plugin would generate
          WEB_CLIENT_ID=$(python3 -c "
          import json
          data = json.load(open('android/app/google-services.json'))
          for client in data['client']:
              for oc in client['oauth_client']:
                  if oc['client_type'] == 3:
                      print(oc['client_id'])
                      break
          ")
          mkdir -p android/app/src/main/res/values
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><string name=\"default_web_client_id\">${WEB_CLIENT_ID}</string></resources>" \
            > android/app/src/main/res/values/google-services-generated.xml

      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            --title "TravelPlanner build #${{ github.run_number }}" \
            --notes "APK debug generado automáticamente desde el commit ${{ github.sha }}" \
            android/app/build/outputs/apk/debug/app-debug.apk#TravelPlanner-debug.apk
